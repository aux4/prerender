name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  # NOTE: the test jobs use aux4/test-package-action@v1 (composite, runs on the
  # host runner) rather than aux4/action@v1 command:test. aux4/action runs the
  # test suite inside the aux4 Docker image, which has no browser engine; prerender
  # drives the aux4/browser daemon, which launches Chromium at daemon start — so the
  # tests must run on the host, exactly like the aux4/browser package's own CI.
  # The daemon uses the Playwright version BUNDLED inside aux4/browser, so we must
  # install the Chromium revision that matches THAT bundled Playwright (not an
  # arbitrary npx-latest one, which mismatches and makes the daemon fail to start).
  # We therefore install aux4/browser first and drive its own bundled Playwright CLI
  # to fetch the exact matching Chromium. lint and publish still use aux4/action@v1.
  test-linux:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install aux4/browser + matching Chromium
        shell: bash
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          aux4 aux4 pkger install aux4/browser
          node "$HOME/.aux4.config/packages/aux4/browser/lib/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Test
        uses: aux4/test-package-action@v1
        with:
          build_command: npm run build

  test-darwin:
    needs: [lint]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install aux4/browser + matching Chromium
        shell: bash
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          aux4 aux4 pkger install aux4/system-installer-brew
          aux4 aux4 pkger install aux4/browser
          node "$HOME/.aux4.config/packages/aux4/browser/lib/node_modules/playwright/cli.js" install chromium

      - name: Test
        uses: aux4/test-package-action@v1
        with:
          build_command: npm run build

  publish:
    needs: [test-linux, test-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          aux4_token: ${{ secrets.AUX4_ACCESS_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
